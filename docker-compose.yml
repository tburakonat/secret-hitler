services:
  postgres:
    image: postgres:16-alpine
    container_name: secret-hitler-postgres
    environment:
      POSTGRES_DB: secret_hitler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secret-hitler-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: secret-hitler-backend
    environment:
      PORT: "3000"
      NODE_ENV: development
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/secret_hitler
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: change-me-in-production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:3000
    container_name: secret-hitler-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  redisinsight:
    image: redis/redisinsight:latest
    container_name: secret-hitler-redisinsight
    ports:
      - "8001:5540"
    depends_on:
      - redis

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: secret-hitler-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
