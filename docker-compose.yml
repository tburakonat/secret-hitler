services:
  postgres:
    image: postgres:16-alpine
    container_name: secret-hitler-postgres
    environment:
      POSTGRES_DB: secret_hitler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: secret-hitler-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1

  redisinsight:
    image: redis/redisinsight:latest
    container_name: secret-hitler-redisinsight
    ports:
      - "8001:5540"
    depends_on:
      - redis

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: secret-hitler-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
